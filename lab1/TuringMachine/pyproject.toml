[project]
name = "turing-machine"
version = "0.1.0"
description = "Binary increment/decrement Turing machine with a console interface"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
turing-machine = "CLI:startCli"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.17.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["TM", "CLI", "main"]

[tool.pytest.ini_options]
python_files = ["test.py"]
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
source = ["TM"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
