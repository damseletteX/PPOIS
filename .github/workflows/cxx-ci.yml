name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain & linter
        run: sudo apt-get update -qq && sudo apt-get install -y cmake ninja-build libgtest-dev clang-format

      - name: Run Linter (clang-format)
        run: |
          echo "Checking code formatting..."
          find ./lab1/Set/src ./lab1/Set/include ./lab1/Set/unit-test -name "*.cpp" -o -name "*.h" -o -name "*.hpp" | xargs clang-format --dry-run --Werror

      - name: Show repository files
        run: find . -name CMakeLists.txt -print

      - name: Configure
        run: cmake -S ./lab1/Set -B build -G Ninja

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: ctest --test-dir build --output-on-failure