name: Turing CI

on:
  push:
    branches: ["1stLab", "main"]
    paths:
      - "lab1/TuringMachine/**"
      - ".github/workflows/turing-ci.yml"
  pull_request:
    paths:
      - "lab1/TuringMachine/**"

defaults:
  run:
    working-directory: lab1/TuringMachine

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          cache-dependency-glob: lab1/TuringMachine/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.14'
        with:
          name: coverage-report
          path: lab1/TuringMachine/coverage.xml

  build:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: lab1/TuringMachine/dist/