name: C++ CI

on:
  push:
    branches: [ "main", "lab1/set" ]
  pull_request:
    branches: [ "main", "lab1/set" ]

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - name: Install toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y cmake ninja-build libgtest-dev
 
      - name: Configure
        run: cmake -S . -B build -G Ninja
 
      - name: Build
        run: cmake --build build
 
      - name: Run tests
        run: ctest --test-dir build --output-on-failure
 
