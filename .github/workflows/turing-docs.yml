name: Turing Machine documentation

on:
  push:
    branches:
      - main
      - 1stLab
    paths:
        - "lab1/TuringMachine/*.py"
        - "lab1/TuringMachine/pyproject.toml"
        - ".github/workflows/turing-docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab1/TuringMachine
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run pdoc -o docs-site TM CLI
      - uses: actions/upload-pages-artifact@v4
        with:
          path: lab1/TuringMachine/docs-site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5